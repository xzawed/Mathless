name: CI

on:
  push:
    branches: [main]
  pull_request:

# Supersede in-progress runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Insurance, NOT an authority — and NOT D22. This job never builds a `.so` and never loads
  # a module: every acceptance test is `#![cfg(windows)]` and compiles away here. What it does
  # catch is a Windows-only assumption sneaking into the platform-independent frontend
  # (lex/parse/typecheck/IR, the code generators, the CLI, temp-path handling), which would
  # otherwise only surface the day someone targets another OS. Starting a real `.so`/ELF
  # target needs an explicit D22 decision; this is not it.
  linux-frontend:
    name: frontend fmt + clippy + test (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure rustfmt + clippy
        run: rustup component add rustfmt clippy
      - name: Format check
        run: cargo fmt --all --check
      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test (locked)
        # No MATHLESS_GATE_D here: acceptance D is a Windows gate, and demanding it on Linux
        # would be theatre. The windows job is where that is enforced.
        run: cargo test --workspace --locked

  windows:
    # Authoritative job. Acceptance A/B/C/D build a real `.dll`, `LoadLibraryW` it, and build
    # a C host with MSVC that loads it too — all `#![cfg(windows)]` (Phase 1 target; SO/ELF is
    # deferred, D22). Running the suite HERE is what makes those acceptance tests actually
    # execute in CI — a Linux runner would compile them away and report a vacuous pass (the
    # "false-green" this job exists to kill).
    name: fmt + clippy + test (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure rustfmt + clippy
        run: rustup component add rustfmt clippy
      - name: Format check
        run: cargo fmt --all --check
      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Cache the Free Pascal installer
        # ONE file, 90 MB, keyed on the version AND the hash it must have. The tree it
        # installs is ~730 MB across thousands of small files, and restoring THAT on
        # Windows is a second fat tail -- the stall was never the unpack, it was the
        # download. `fpc-installer` is OURS; #191 recorded, at length, what happens when
        # the cached directory belongs to a package manager instead.
        uses: actions/cache@v4
        with:
          path: fpc-installer
          key: fpc-installer-3.2.2-win32-and-win64-sha8c2553
      - name: Install Free Pascal (win32 + win64)
        # The generated `.pas` is one of the four artifacts `mlc build` writes, and until
        # this step existed NOTHING compiled it -- the golden file pinned 535 lines that no
        # compiler of any kind had ever read. This is NOT the Delphi gate.
        #
        # WHY NOT `choco install freepascal`. Because it cannot install this file. The
        # package calls Install-ChocolateyPackage twice -- once for the i386-win32
        # installer, once for this combined one -- into ONE cache path under one package
        # name and version, declaring the SAME sha256 string for both. So the second call
        # finds the first file, "verifies" it against a checksum copied from the first, and
        # installs i386 again. The runner has never seen the combined installer, which is
        # why CI's fpc had no x86_64 backend and MATHLESS_GATE_FPC_HOST could only skip
        # there (docs/STATUS.md 9-21). The declared checksum64 is not this file's hash, so
        # pre-seeding cannot work either: choco would reject the bytes.
        #
        # WHY THE CACHE. The chocolatey package fetched its installer from SourceForge, and
        # that dependency was billed twice against a REQUIRED gate, measured:
        #
        #   2026-09-08   no answer, two 33s timeouts  -> a PR went red for nothing to do
        #                                                with its code
        #   2026-09-09   answered, but took 12 min    -> the job went from ~3.5 to 14m25s
        #
        # So we fetch it, we check its hash, and we install it ourselves.
        shell: pwsh
        run: |
          $keep = Join-Path $PWD "fpc-installer"
          $exe  = Join-Path $keep "fpc-3.2.2.win32.and.win64.exe"
          # Measured here, not quoted from the package: 93,909,874 bytes, starts MZ. The
          # chocolatey package declares 7ec78b... for this URL, which is the i386 file's
          # hash -- so there was no trustworthy value to copy.
          $sha  = "8C255390544B051388B577EB61C6191A04883264AFE0E3369B3600A56DAF7BDE"
          $url  = "https://sourceforge.net/projects/freepascal/files/Win32/3.2.2/fpc-3.2.2.win32.and.win64.exe/download"
          # The official installer's own default, and where this project's dev machine has
          # it, so CI and local converge. It is also the first root the gate searches.
          $dir  = "C:\FPC\3.2.2"
          New-Item -ItemType Directory -Force -Path $keep | Out-Null

          function Test-Cached($path, $want) {
            if (-not (Test-Path $path)) { return $false }
            return (Get-FileHash $path -Algorithm SHA256).Hash -eq $want
          }

          if (Test-Cached $exe $sha) {
            Write-Host "installer cache HIT: $([int]((Get-Item $exe).Length/1MB)) MB, sha256 verified"
          } else {
            if (Test-Path $exe) {
              Write-Host "::warning::cached installer failed its sha256 -- discarding it"
              Remove-Item $exe -Force
            }
            Write-Host "installer cache MISS -- fetching from SourceForge"
            # The UserAgent is load-bearing. SourceForge serves a BROWSER an HTML "your
            # download will start" page, and Invoke-WebRequest's default UA says Mozilla --
            # so the call succeeds, writes ~146 KB of `<!doctype html>`, throws nothing, and
            # only the hash notices. Measured both ways, 2026-09-09.
            $ProgressPreference = 'SilentlyContinue'
            foreach ($attempt in 1..3) {
              Write-Host "fetch attempt $attempt of 3"
              try {
                Invoke-WebRequest -Uri $url -OutFile $exe -MaximumRedirection 10 -UserAgent "curl/8.4.0"
              } catch {
                Write-Host "  threw: $($_.Exception.Message)"
              }
              if (Test-Cached $exe $sha) { break }
              # Say what DID arrive. Silent instant failures is what the first cut of this
              # loop produced, and the log could not tell a dead host from an HTML page.
              if (Test-Path $exe) {
                Write-Host "  wrong file: $((Get-Item $exe).Length) bytes, sha256 $((Get-FileHash $exe -Algorithm SHA256).Hash)"
                Remove-Item $exe -Force
              } else {
                Write-Host "  nothing written"
              }
              if ($attempt -lt 3) { Start-Sleep -Seconds (20 * $attempt) }
            }
            if (-not (Test-Cached $exe $sha)) {
              Write-Host '::error::the Free Pascal installer could not be fetched from SourceForge (or arrived with the wrong sha256) after 3 attempts. This is an availability failure of that host, NOT a defect in the diff -- re-run the job.'
              exit 1
            }
            Write-Host "fetched $([int]((Get-Item $exe).Length/1MB)) MB, sha256 verified"
          }

          # Inno Setup answer file. This is what the chocolatey package does too, minus its
          # explicit component list -- `SetupType=full` is what brings the x86_64 cross
          # compiler in, and naming components would be a list to forget to update.
          $inf = Join-Path $env:RUNNER_TEMP "fpc-setup.inf"
          @(
            "[Setup]",
            "Lang=default",
            "Dir=$dir",
            "Group=Free Pascal",
            "NoIcons=1",
            "SetupType=full",
            "Tasks="
          ) | Set-Content -Path $inf -Encoding ASCII
          $proc = Start-Process -FilePath $exe -ArgumentList "/verysilent","/norestart","/LoadInf=`"$inf`"" -PassThru -Wait
          if ($proc.ExitCode -ne 0) {
            Write-Host "::error::the Free Pascal installer exited $($proc.ExitCode). The file was hash-verified before this ran, so this is an INSTALL failure, not a download one."
            exit 1
          }

          # The point of this step, asserted rather than assumed. Installing an fpc that
          # cannot target x86_64 would leave MATHLESS_GATE_FPC_HOST skipping exactly as it
          # did under chocolatey -- green, and measuring nothing.
          $bin = Join-Path $dir "bin\i386-win32"
          $fpc = Join-Path $bin "fpc.exe"
          if (-not (Test-Path $fpc)) {
            Write-Host "::error::no fpc.exe at $fpc after a successful install"
            Get-ChildItem $dir -Recurse -Depth 3 -Filter "fpc.exe" -ErrorAction SilentlyContinue |
              ForEach-Object { Write-Host "  found instead: $($_.FullName)" }
            exit 1
          }
          $target = (& $fpc -Px86_64 -iTP 2>$null | Select-Object -First 1)
          if ($LASTEXITCODE -ne 0 -or "$target".Trim() -ne "x86_64") {
            Write-Host "  fpc -Px86_64 -iTP said '$target' (exit $LASTEXITCODE), expected x86_64"
            Write-Host "  compilers present:"
            Get-ChildItem $bin -Filter "ppc*.exe" | ForEach-Object { Write-Host "    $($_.Name)" }
            Write-Host '::error::this fpc has no x86_64 backend, so the Pascal host gate would skip. That is the entire reason this step installs the combined win32+win64 build.'
            exit 1
          }
          Write-Host "fpc $(& $fpc -iV) at $fpc, x86_64 backend present"
          Add-Content -Path $env:GITHUB_PATH -Value $bin
      - name: Test (locked)
        # MATHLESS_GATE_D=require turns "no MSVC found" into a FAILURE instead of a skip, so
        # acceptance D (a real C host loading the module) can never silently stop running
        # here and leave a green tick behind. windows-latest ships the VC++ build tools.
        env:
          MATHLESS_GATE_D: require
          # Same reason, for the same failure mode: a gate that skips can never go red, and
          # the FPC gate caught a real defect on its first run (11 of 19 units warned).
          MATHLESS_GATE_FPC: require
        run: cargo test --workspace --locked
      - name: Say what the FPC gate measured
        # cargo swallows a passing test's stdout, so `GATE_FPC_OK` never reaches the log
        # above -- the same trap STATUS 5-5.7 records for guard warnings. This re-runs the
        # one test with --nocapture so the log says WHICH fpc it used and WHICH target it
        # compiled for.
        #
        # It is also where the Pascal HOST gate reports itself, and that line is the point
        # of installing the combined build: `GATE_FPC_HOST_SKIPPED` means the runner's fpc
        # cannot target x86_64 and the host never ran, `GATE_FPC_HOST_LOADBIND_OK` means it
        # built, loaded real x64 modules and called them. Under chocolatey this log said
        # SKIPPED every time. Seconds, and everything is already built.
        env:
          MATHLESS_GATE_FPC: require
        run: cargo test -p ml_oracle --test fpc_units --locked -- --nocapture
